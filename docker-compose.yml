services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netapi
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=NetAPI_Dev;User Id=sa;Password=YourStrongP@ssw0rd!;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Key=docker-dev-super-secret-key-32chars!!
      - Jwt__Issuer=NetAPI
      - Jwt__Audience=NetAPI.Client
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netapi-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: netapi-sqlserver
    environment:
      SA_PASSWORD: "YourStrongP@ssw0rd!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongP@ssw0rd!' -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - netapi-network

  redis:
    image: redis:7-alpine
    container_name: netapi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - netapi-network

volumes:
  sqlserver-data:
  redis-data:

networks:
  netapi-network:
    driver: bridge
